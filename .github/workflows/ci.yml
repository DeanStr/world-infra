name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace --no-default-features
      - run: cargo test --workspace --all-features --examples
      - run: cargo doc --workspace --all-features --no-deps
      - name: Product pin snippet smoke
        run: |
          scripts/pinned-product-deps.sh --rev HEAD > /tmp/world-infra-product-pins.txt
          grep -F 'testcontainers = { version = "0.27", default-features = false }' /tmp/world-infra-product-pins.txt
          grep -F 'url = "2.5"' /tmp/world-infra-product-pins.txt
          grep -F 'url = { workspace = true }' /tmp/world-infra-product-pins.txt
          grep -F 'world-test-containers = { git = "' /tmp/world-infra-product-pins.txt
          grep -F 'features = ["postgres"], optional = true' /tmp/world-infra-product-pins.txt
          grep -F 'features = ["valkey"], optional = true' /tmp/world-infra-product-pins.txt
          grep -F 'event-fanout = { git = "' /tmp/world-infra-product-pins.txt
          grep -F 'world-cycle-core = { git = "' /tmp/world-infra-product-pins.txt
      - name: Feature matrix
        run: |
          cargo install cargo-hack --locked
          cargo hack test --workspace --feature-powerset
      - name: Dependency audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: License and dependency policy
        run: |
          cargo install cargo-deny --locked
          cargo deny check
      - name: Public API semver surface
        run: |
          cargo install cargo-semver-checks --version 0.44.0 --locked
          # The rc7 baseline only contains the first-wave crates below. Newer
          # crates are intentionally omitted until the next semver baseline
          # includes them, otherwise semver-checks cannot find them in rc7.
          cargo semver-checks check-release \
            --package delivery-core \
            --package http-primitives \
            --package idempotency-core \
            --package rate-limit-core \
            --package tenant-scope-sqlx \
            --package world-clock-core \
            --package world-env \
            --package world-identity-core \
            --package world-telemetry \
            --package world-test-lite \
            --baseline-rev world-infra-v0.1.0-rc.7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
