[package]
name = "world-telemetry"
description = "Shared tracing and OpenTelemetry setup primitives."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
default = ["subscriber"]
subscriber = ["dep:tracing-subscriber"]
opentelemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing",
    "dep:tracing-opentelemetry",
    "subscriber",
]
otlp-http = ["opentelemetry", "opentelemetry-otlp/http-proto", "opentelemetry-otlp/reqwest-blocking-client"]
otlp-grpc-tonic = ["opentelemetry", "opentelemetry-otlp/grpc-tonic"]

[dependencies]
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[lints]
workspace = true
